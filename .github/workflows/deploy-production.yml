name: Deploy to Vercel (production)

# Production only. Runs every time code lands on main (i.e. when a pull
# request is merged). vercel.json turns off Vercel's own Git-triggered
# builds, so there are no preview deployments — this workflow is the only
# thing that deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time; a newer merge waits instead of racing.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || vars.VERCEL_TEAM_ID || secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      # Only reached if the deploy step succeeded. The script itself waits
      # for the new deployment to be READY and the live production
      # deployment before it deletes anything.
      - name: Delete all previous deployments
        run: node scripts/vercel-cleanup.mjs "${{ steps.deploy.outputs.url }}"

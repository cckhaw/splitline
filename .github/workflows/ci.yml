name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails the PR on known high/critical advisories in dependencies.
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
        env:
          # Placeholders so the build doesn't need real secrets.
          SESSION_SECRET: ci-placeholder-session-secret-0123456789
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
